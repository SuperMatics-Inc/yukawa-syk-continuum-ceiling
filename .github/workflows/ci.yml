name: replay
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  rational:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pinned file hashes
        run: sha256sum -c MANIFEST.sha256
      - name: Exact rational replay and mutants
        run: |
          set -e
          python -B replay.py
          python -B check_mutants.py
      - name: No em dashes in prose
        run: |
          ! grep -n -e '—' -e '---' paper/main.tex paper/refs.bib
          ! grep -n '—' README.md CITATION.cff
  gamma:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.5.5 scipy python-flint==0.9.0
      - name: Gamma-model certificate replay
        working-directory: gamma
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -u replay.py
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          use-github-cache: false
          build: true
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-recommended texlive-fonts-recommended
      - name: Build the paper
        working-directory: paper
        run: |
          set -e
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          bibtex main
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          test -s main.pdf
